catalogMode: prefer

catalogs:
  build:
    '@nuxt/devtools': ^3.2.4
    '@nuxt/eslint': ^1.15.2
    '@pinia/nuxt': ^0.11.3
    '@unocss/eslint-config': ^66.6.8
    '@unocss/nuxt': ^66.6.8
    '@vueuse/nuxt': ^14.2.1
    nuxt: ^4.4.2
    unocss: ^66.6.8
  dev:
    '@antfu/eslint-config': ^8.1.1
    eslint: ^10.2.0
    eslint-plugin-format: ^2.0.1
    typescript: ^6.0.2
    vue-tsc: ^3.2.6
  frontend:
    '@vueuse/core': ^14.2.1
    es-toolkit: ^1.45.1
    pinia: ^3.0.4
    vue: ^3.5.32
  icons:
    '@iconify-json/carbon': ^1.2.20

cleanupUnusedCatalogs: true

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild

shellEmulator: true

trustPolicy: no-downgrade
